
name: Build EaglerProtector

on:
  workflow_dispatch:
  push:
    paths:
      - "EaglerProtector-source.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Extract project
        run: |
          mkdir project
          unzip EaglerProtector-source.zip -d project

      - name: Build plugin
        run: mvn -f project/pom.xml package

      - name: Save JAR
        uses: actions/upload-artifact@v4
        with:
          name: EaglerProtector-JAR
          path: project/target/*.jar
