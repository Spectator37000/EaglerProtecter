
name: Build EaglerProtector

on:
  workflow_dispatch:
  push:
    paths:
      - "EaglerProtector-source-fixed.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Extract project
        run: |
          mkdir project
          unzip EaglerProtector-source-fixed.zip -d project
          find project -name pom.xml

      - name: Build plugin
        run: |
          POM=$(find project -name pom.xml | head -n 1)
          test -n "$POM" || { echo "pom.xml not found"; exit 1; }
          mvn -f "$POM" package

      - name: Save JAR
        uses: actions/upload-artifact@v4
        with:
          name: EaglerProtector-JAR
          path: project/**/target/*.jar
