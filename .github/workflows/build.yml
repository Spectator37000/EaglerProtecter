
name: Build EaglerProtector

on:
  workflow_dispatch:
  push:
    paths:
      - "EaglerProtector-source-fixed.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Extract project
        run: |
          mkdir project
          unzip EaglerProtector-source-fixed.zip -d project
          python3 - <<'PY'
          from pathlib import Path
          p = Path("project/src/main/java/com/example/eaglerprotector/EaglerProtector.java")
          s = p.read_text()
          s = s.replace("org.bukkit.block.EnderChest", "org.bukkit.block.Chest")
          imp = "import org.bukkit.event.entity.EntityExplodeEvent;"
          if imp not in s:
              s = s.replace("import org.bukkit.event.block.*;", "import org.bukkit.event.block.*;\n" + imp)
          s = "\n".join(line for line in s.splitlines() if "org.bukkit.block.EnderChest" not in line) + "\n"
          p.write_text(s)
          PY
          find project -name pom.xml

      - name: Build plugin
        run: |
          POM=$(find project -name pom.xml | head -n 1)
          test -n "$POM" || { echo "pom.xml not found"; exit 1; }
          mvn -f "$POM" package

      - name: Save JAR
        uses: actions/upload-artifact@v4
        with:
          name: EaglerProtector-JAR
          path: project/**/target/*.jar
